<script>
// ===== Breaker — pitch 2:00. Canvas 2D + Web Audio. Chaque image = draw(t), fonction pure du temps. =====
var W = 1920, H = 1080, T = 120, BPM = 120, BEAT = 60 / BPM;
var C = { bg:'#07111f', ink:'#f6f9fc', text:'#e7edf4', mute:'rgba(231,237,244,.62)', faint:'rgba(231,237,244,.42)', lime:'#c7fa70', sky:'#a8bfff', amber:'#ffc481', line:'rgba(255,255,255,.12)' };
var DISP = 'Manrope', BODY = 'DM Sans', MONO = 'IBM Plex Mono';
var cv = document.getElementById('c'), x = cv.getContext('2d');
function fit(){ var k = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
addEventListener('resize', fit); fit();

// ---------- outils ----------
var cl = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var pr = function(t,a,d){ return cl((t - a) / (d || .4), 0, 1); };
var eo = function(p){ return 1 - Math.pow(1 - p, 4); };
var eio = function(p){ return p < .5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2; };
var bk = function(p){ var c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function hash(i){ var s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }

// Texte : mode 'slam' (zoom arrière + flou), 'rise', 'cut' (apparition sèche), sortie à `out`.
function txt(t, s, px, py, o){
  o = o || {}; var at = o.at || 0, out = o.out, size = o.size || 120, col = o.col || C.ink, wt = o.wt || 800, fam = o.fam || DISP, al = o.al || 'left', mode = o.mode || 'slam';
  if (t < at) return; var p = pr(t, at, o.dur || (mode === 'slam' ? .35 : .5)), e = eo(p);
  var q = out != null ? pr(t, out, .22) : 0; if (q >= 1) return;
  var a = (mode === 'cut' ? 1 : cl(p * 3, 0, 1)) * (1 - q), sc = 1, dy = 0, bl = 0;
  if (mode === 'slam'){ sc = (o.from || 1.8) + (1 - (o.from || 1.8)) * e; bl = (1 - e) * 22; }
  if (mode === 'rise'){ dy = (1 - e) * 40; bl = (1 - e) * 8; }
  sc *= 1 + q * .06; bl += q * 14;
  x.save(); x.globalAlpha = a * (o.alpha == null ? 1 : o.alpha);
  x.font = wt + ' ' + size + 'px "' + fam + '"'; x.textAlign = al; x.textBaseline = 'alphabetic';
  if (o.ls) x.letterSpacing = o.ls + 'px';
  var w = x.measureText(s).width, ox = al === 'left' ? px + w / 2 : al === 'right' ? px - w / 2 : px;
  x.translate(ox, py + dy - size * .35); x.scale(sc, sc); x.translate(-ox, -(py - size * .35));
  if (bl > .4) x.filter = 'blur(' + bl.toFixed(1) + 'px)';
  if (o.glow){ x.shadowColor = col; x.shadowBlur = o.glow; }
  x.fillStyle = col; x.fillText(s, px, py); x.restore();
}
function mono(t, s, px, py, o){ o = o || {}; o.fam = MONO; o.wt = 500; o.size = o.size || 24; o.col = o.col || C.faint; o.mode = o.mode || 'rise'; o.ls = 2; txt(t, s, px, py, o); }
function body(t, s, px, py, o){ o = o || {}; o.fam = BODY; o.wt = o.wt || 500; o.size = o.size || 40; o.col = o.col || C.mute; o.mode = o.mode || 'rise'; txt(t, s, px, py, o); }
function rr(px, py, w, h, r){ x.beginPath(); x.roundRect(px, py, w, h, r); }
function glass(px, py, w, h, a, edge){ x.save(); x.globalAlpha = a; rr(px, py, w, h, 26);
  var g = x.createLinearGradient(px, py, px + w, py + h); g.addColorStop(0, 'rgba(255,255,255,.11)'); g.addColorStop(.5, 'rgba(255,255,255,.035)'); g.addColorStop(1, 'rgba(255,255,255,.07)');
  x.fillStyle = '#0c1828'; x.fill(); x.fillStyle = g; x.fill(); x.strokeStyle = edge || 'rgba(255,255,255,.15)'; x.lineWidth = 2; x.stroke(); x.restore(); }
function pill(t, s, px, py, col, ink, at, o){ o = o || {}; if (t < at) return; var p = bk(pr(t, at, .35)), q = o.out != null ? pr(t, o.out, .2) : 0; if (q >= 1) return;
  var size = o.size || 60; x.save(); x.font = '800 ' + size + 'px "' + DISP + '"'; var w = x.measureText(s).width + size * 1.2, h = size * 1.7;
  x.globalAlpha = 1 - q; x.translate(px + w / 2, py + h / 2); x.scale(.4 + .6 * p, .4 + .6 * p); x.translate(-(px + w / 2), -(py + h / 2));
  rr(px, py, w, h, h / 2); x.fillStyle = col; x.fill(); x.fillStyle = ink; x.textBaseline = 'middle'; x.fillText(s, px + size * .6, py + h / 2 + size * .04); x.restore(); return w; }
function ring(t, cx, cy, at, col, big){ var a = t - at; if (a < 0 || a > 1.2) return; var p = a / 1.2;
  x.save(); x.globalAlpha = .8 * (1 - p); x.strokeStyle = col; x.lineWidth = 5 * (1 - p); x.beginPath(); x.arc(cx, cy, eo(p) * (big || 1100), 0, 7); x.stroke(); x.restore(); }
function bar(t, px, py, w, h, at, d, col){ if (t < at) return; var p = eo(pr(t, at, d || .5)); x.fillStyle = col; rr(px, py, w * p, h, h / 2); x.fill(); }
function ticker(t, s, py, col, a){ x.save(); x.globalAlpha = a; x.font = '800 170px "' + DISP + '"'; x.fillStyle = col; x.letterSpacing = '-6px';
  var u = s + ' · ', w = x.measureText(u).width, off = -((t * 320) % w); for (var i = 0; i < 4; i++) x.fillText(u, off + i * w, py); x.restore(); }
function logo(t, px, py, s, at){ if (t < at) return; var p = eo(pr(t, at, .4)); x.save(); x.globalAlpha = cl(p * 3, 0, 1); x.translate(px, py); var k = s * (2.2 - 1.2 * p); x.scale(k, k);
  if (p < 1) x.filter = 'blur(' + ((1 - p) * 3) + 'px)';
  x.beginPath(); x.moveTo(1,1); x.lineTo(23.6,1); x.lineTo(33,10.4); x.lineTo(33,37); x.lineTo(10.4,37); x.lineTo(1,27.6); x.closePath(); x.fillStyle = C.lime; x.fill();
  x.fillStyle = '#142008'; x.fill(new Path2D('M10.5 9h7.25a5.25 5.25 0 0 1 0 10.5H10.5zM10.5 17.5h8.25a5.75 5.75 0 0 1 0 11.5H10.5z'));
  x.fillStyle = C.lime; x.fill(new Path2D('M14.5 12.6h3.1a1.65 1.65 0 0 1 0 3.3h-3.1zM14.5 21.6h4.1a1.9 1.9 0 0 1 0 3.8h-4.1z')); x.restore(); }

// ---------- fond : nuit, lumières qui dérivent, trame de points, pulsation sur le temps ----------
function bg(t, tint){
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  var beat = Math.pow(1 - ((t / BEAT) % 1), 6) * (t > 4 ? 1 : 0);
  var L = [[ -100 + Math.sin(t / 7) * 120, -100 + Math.cos(t / 9) * 80, 900, 'rgba(199,250,112,' + (.16 + .05 * beat) + ')'],
